unbind C-s
set -g prefix C-s
bind C-s send-prefix

set -g focus-events on
set -g history-limit 99999
set -g status-interval 5
set -s escape-time 0
setw -g mode-keys vi
setw -g mouse on
setw -g automatic-rename off

set -g mode-style fg=colour127,bg=colour225

set -g pane-active-border-style fg=colour15,bg=black
set -g pane-border-style fg=colour142,bg=colour229

set -g message-style fg=colour15,bg=black
set -g status-style fg=colour244,bg=colour255
set -g window-status-current-style fg=colour15,bg=black
set -g window-status-style fg=colour244,bg=colour255

set -g status-position top
set -g pane-border-style fg=white
set -g status-right "%a %d-%m %H:%M"
set -g status-left ""
set -g window-status-format " #I #W "
set -g window-status-current-format " #I #W "

bind r source-file ~/.tmux.conf
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind v split-window -h
bind s split-window
bind q kill-pane

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind-key = select-layout -E

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"
